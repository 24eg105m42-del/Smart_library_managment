spring.application.name=backend

# Import .env file if present
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Server Port (Render provides PORT, default to 8080 locally)
server.port=${PORT:8080}

# Frontend & CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:https://smart-library-managment-sigma.vercel.app},https://smart-library-managment-sigma.vercel.app,http://localhost:5173,https://ai-smart-library-frontend.vercel.app}

# Database Configuration
# Uses external database URL (e.g. PostgreSQL on Render) if provided, otherwise H2 database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartlibrary;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false